name: shellcheck

on:
  push:
    paths:
      - "commands/shell/**"
      - ".github/workflows/shellcheck.yml"
  pull_request:
    types: ["opened", "synchronize", "reopened"]
    paths:
      - "commands/shell/**"
      - ".github/workflows/shellcheck.yml"

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run shellcheck
        run: shellcheck commands/shell/*

